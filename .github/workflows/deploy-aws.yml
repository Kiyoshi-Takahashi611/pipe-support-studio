name: Deploy managed app
on:
  push:
    branches: [main]
    paths: ['dist/**', 'web/**', 'scripts/build-aws.mjs', '.github/workflows/deploy-aws.yml']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: deploy-aws-production
  cancel-in-progress: false
jobs:
  deploy:
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify calculations and auth
        run: node --test test-*.mjs
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1
      - name: Build
        run: node scripts/build-aws.mjs
      - name: Publish and verify
        shell: bash
        run: |
          set -euo pipefail
          STACK=$(aws cloudformation describe-stacks --stack-name pipe-support-studio)
          BUCKET=$(jq -r '.Stacks[0].Outputs[]|select(.OutputKey=="WebBucketName")|.OutputValue' <<< "$STACK")
          DIST=$(jq -r '.Stacks[0].Outputs[]|select(.OutputKey=="CloudFrontDistributionId")|.OutputValue' <<< "$STACK")
          DOMAIN=$(jq -r '.Stacks[0].Outputs[]|select(.OutputKey=="CloudFrontDomain")|.OutputValue' <<< "$STACK")
          aws s3 sync build/aws-web/ "s3://$BUCKET/" --exclude index.html --cache-control no-cache
          aws s3 cp build/aws-web/index.html "s3://$BUCKET/index.html" --content-type 'text/html; charset=utf-8' --cache-control no-cache
          ID=$(aws cloudfront create-invalidation --distribution-id "$DIST" --paths '/*' --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DIST" --id "$ID"
          curl -fsS "https://$DOMAIN/version.json" -o /tmp/live-version.json
          cmp build/aws-web/version.json /tmp/live-version.json
